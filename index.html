<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome (for swap icon) -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="container">

        <h1>💱 Currency Converter</h1>

        <!-- Amount -->
        <div class="input-box">
            <label for="amount">Enter Amount</label>
            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
                value="1"
            >
        </div>

        <!-- Currency Selection -->
        <div class="currency-container">

            <!-- From Currency -->
            <div class="currency-box">
                <label for="fromCurrency">From</label>
                <div class="select-container">
                <img id="fromFlag" src="https://flagsapi.com/US/flat/64.png" alt="From Flag">

                <select id="fromCurrency">
                    <!-- Options will be added using JavaScript -->
                </select>
            </div>

            <!-- Swap Button -->
            <button id="swapBtn" title="Swap Currencies">
                <i class="fa-solid fa-right-left"></i>
            </button>

            <!-- To Currency -->
            <div class="currency-box">
                <label for="toCurrency">To</label>
                <div class="select-container">
                <img id="toFlag" src="https://flagsapi.com/IN/flat/64.png" alt="to Flag">
                <select id="toCurrency">
                    <!-- Options will be added using JavaScript -->
                </select>
            </div>

        </div>

        <!-- Convert Button -->
        <button id="convertBtn">Convert</button>

        <!-- Result -->
        <div class="result-box">
            <h2>Converted Amount</h2>
            <p id="result">1 USD = 0.00 INR</p>
        </div>

        <!-- Exchange Rate -->
        <div class="rate-box">
            <p id="exchangeRate">
                Exchange Rate: --
            </p>
        </div>

        <!-- Last Updated -->
        <div class="update-box">
            <small id="lastUpdated">
                Last Updated: --
            </small>
        </div>

        <!-- Error Message -->
        <p id="errorMessage"></p>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
